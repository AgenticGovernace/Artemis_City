services:
  # Core Artemis Services
  # The DEPLOYMENT.md spec calls for three Python services on 8000/8001/
  # 8002 (Kernel / Memory Bus / Registry). Today only the FastAPI
  # dashboard at app/api/main.py is wired up as an HTTP server; the
  # memory bus and registry are in-process libraries used by the
  # orchestrator. They run inside the ``kernel`` container until they
  # graduate to standalone services -- when they do, add ``memory-bus``
  # and ``registry`` entries below that build from Dockerfile-python with
  # their own CMDs, and split the volumes out.
  kernel:
    build:
      context: .
      dockerfile: src/Dockerfile-python
    pull_policy: build
    ports:
      - "3000:3000"
    environment:
      - ARTEMIS_ENV=production
      - ARTEMIS_LOG_LEVEL=INFO
      - ARTEMIS_OBSIDIAN_VAULT_PATH=/data/vault
      - ARTEMIS_VECTOR_STORE_URL=http://vector-store:6333
      - ARTEMIS_REDIS_URL=redis://redis:6379
      - ARTEMIS_MEMORY_WRITE_TIMEOUT_MS=200
      - ARTEMIS_MEMORY_SYNC_TIMEOUT_MS=300
    depends_on:
      - redis
      - vector-store
    volumes:
      - ./vault:/data/vault
      - ./data/checkpoints:/data/checkpoints
      - ./logs:/var/log/artemis
    networks:
      - artemis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # TS Express boundary (app/api/index.ts). Public /api/v1/* HTTP layer
  # that forwards to the Python core via the api_bridge subprocess.
  # The image (root Dockerfile) ships python3 + src/ so the bridge can
  # spawn ``python3 -m src.api_bridge`` in-container.
  express-api:
    build:
      context: .
      dockerfile: src/Dockerfile
    pull_policy: build
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=Development
      - API_PORT=4000
      - ARTEMIS_KERNEL_URL=http://kernel:8000
      - ARTEMIS_API_KEY_DEFAULT=${ARTEMIS_API_KEY_DEFAULT:?ARTEMIS_API_KEY_DEFAULT must be set}
    depends_on:
      - kernel
    networks:
      - artemis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infrastructure Services
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - artemis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  vector-store:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - vector-data:/qdrant/storage
    networks:
      - artemis
    restart: unless-stopped
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - artemis
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - artemis
    restart: unless-stopped
volumes: { redis-data:  , vector-data:  , prometheus-data:  , grafana-data: }

